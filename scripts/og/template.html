<!doctype html>
<!-- Share preview (1200×630), one per language. Rendered to public/og/{en,ar}.png
     by scripts/og/render.mjs, which fills in the mountains, city lights and logo
     from the site's own sources (src/lib/hajar.ts, src/lib/logo.ts). -->
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600&display=block" rel="stylesheet" />
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative; overflow: hidden; color: #f2f1ec; font-family: "Readex Pro", sans-serif; font-weight: 300;
    /* Sunset over the Hajar mountains, as the page looks at its Launch chapter. */
    background: linear-gradient(to bottom, #0a090a 0%, #170c0a 48%, #3d1709 100%);
  }
  /* The sun sets on the side opposite the text, half behind the ridges. */
  .glow { position: absolute; inset: 0; background: radial-gradient(55% 65% at 80% 90%, rgb(255 110 50 / 45%), transparent 70%); }
  [dir="rtl"] .glow { background: radial-gradient(55% 65% at 20% 90%, rgb(255 110 50 / 45%), transparent 70%); }
  .sun { position: absolute; left: calc(80% - 34px); top: 486px; width: 68px; height: 68px; border-radius: 50%; background: radial-gradient(circle, #ff7a3d 0 45%, transparent 72%); box-shadow: 0 0 90px 24px rgb(255 90 36 / 35%); }
  [dir="rtl"] .sun { left: calc(20% - 34px); }
  .ridges { position: absolute; left: 0; bottom: 0; width: 1200px; height: 150px; }
  .ridges .far { fill: #2a120a; } .ridges .mid { fill: #1c0c08; } .ridges .near { fill: #120806; }
  .ridges .line { fill: none; stroke: rgb(255 170 120 / 22%); stroke-width: 1.4; }
  .ridges .near-line { stroke: rgb(255 120 60 / 55%); }
  .ridges .city circle { fill: #ffc98a; }
  .ridges .city { filter: drop-shadow(0 0 2px #ffb070); }
  .copy { position: absolute; inset: 0; padding: 62px 72px 0; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 24px; font-weight: 500; }
  .brand svg { width: 54px; height: 54px; }
  .brand .tile { fill: #f2f1ec; } .brand .letter { fill: #0b0b0c; } .brand .sunpath { fill: #ff5a24; }
  h1 { margin-top: 86px; font-size: 82px; font-weight: 500; line-height: 1.02; letter-spacing: -0.045em; white-space: nowrap; }
  [lang="ar"] h1 { font-size: 92px; font-weight: 600; line-height: 1.3; letter-spacing: 0; margin-top: 64px; }
  h1 > span { display: block; }
  h1 .first { color: rgb(242 241 236 / 55%); }
  h1 .stop { display: inline; color: #ff5a24; }
  .meta { margin-top: 30px; display: flex; align-items: center; gap: 16px; font-size: 24px; color: rgb(242 241 236 / 75%); }
  .sep { width: 5px; height: 5px; border-radius: 50%; background: rgb(242 241 236 / 35%); }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="sun"></div>
  <svg class="ridges" viewBox="{{VIEWBOX}}" preserveAspectRatio="xMidYMax slice">{{RIDGES}}</svg>
  <section class="copy">
    <p class="brand">{{LOGO}}<span id="name"></span></p>
    <h1><span class="first" id="l1"></span><span><span id="l2"></span><span class="stop">.</span></span></h1>
    <p class="meta"><span id="role"></span><span class="sep"></span><span id="place"></span></p>
  </section>
  <script>
    // The second line's full stop is the logo's orange sun.
    const copy = {
      en: { name: "Khalil Alblushi", l1: "You bring the idea.", l2: "I build the rest", role: "Software Engineer", place: "Muscat, Oman" },
      ar: { name: "خليل البلوشي", l1: "الفكرة منك،", l2: "والباقي عليّ", role: "مهندس برمجيات", place: "مسقط، عُمان" },
    };
    const lang = new URLSearchParams(location.search).get("lang") === "ar" ? "ar" : "en";
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    for (const [id, text] of Object.entries(copy[lang])) document.getElementById(id).textContent = text;
  </script>
</body>
</html>
